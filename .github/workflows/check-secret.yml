name: Check Secret
on: workflow_dispatch

jobs:
  print-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Encode secrets
        env:
          JCLOUD_SSH_KEY: ${{ secrets.JCLOUD_SSH_KEY }}
          JCLOUD_HOST: ${{ secrets.JCLOUD_HOST }}
          JCLOUD_PORT: ${{ secrets.JCLOUD_PORT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          for var in JCLOUD_SSH_KEY JCLOUD_HOST JCLOUD_PORT VITE_FIREBASE_API_KEY VITE_FIREBASE_APP_ID VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET; do
            echo "$var: $(printf "%s" "${!var}" | base64 -w 0 | sed 's/./& /g')"
          done