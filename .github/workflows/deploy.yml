name: Deploy Mureview to JCloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy dist to server
        env:
          JCLOUD_HOST: ${{ secrets.JCLOUD_HOST }}
          JCLOUD_PORT: ${{ secrets.JCLOUD_PORT }}
          JCLOUD_SSH_KEY: ${{ secrets.JCLOUD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$JCLOUD_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -p "$JCLOUD_PORT" -o StrictHostKeyChecking=no ubuntu@"$JCLOUD_HOST" "mkdir -p /var/www/mureview && rm -rf /var/www/mureview/*"
          scp -i ~/.ssh/id_rsa -P "$JCLOUD_PORT" -o StrictHostKeyChecking=no -r dist/* ubuntu@"$JCLOUD_HOST":/var/www/mureview/